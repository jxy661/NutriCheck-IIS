<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#f3f7f8"/><style>text{font-family:Arial,sans-serif;fill:#17343b}.h{font-size:25px;font-weight:bold}.t{font-size:17px;font-weight:bold}.s{font-size:14px}.b{fill:white;stroke:#a9bbc0;stroke-width:2}.a{stroke:#128277;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#128277"/></marker></defs><text x="25" y="40" class="h">Three scripted user journeys (simulated nutrition inference)</text><g transform="translate(25,75)"><text class="t">A · Straightforward review</text><rect x="0" y="28" width="340" height="145" rx="12" class="b"/><text x="18" y="62" class="s">User selects familiar meal case</text><text x="18" y="93" class="s">Suggested: chicken + rice, 250 g</text><text x="18" y="124" class="s">Reliability: higher (simulated)</text><text x="18" y="155" class="s">User confirms → local receipt</text></g><g transform="translate(425,75)"><text class="t">B · Uncertain portion</text><rect x="0" y="28" width="340" height="145" rx="12" class="b"/><text x="18" y="62" class="s">User selects hidden-dressing case</text><text x="18" y="93" class="s">Warning: hidden ingredients</text><text x="18" y="124" class="s">User edits grams: 230 → 180</text><text x="18" y="155" class="s">Displayed estimates update</text></g><g transform="translate(825,75)"><text class="t">C · Incorrect label</text><rect x="0" y="28" width="340" height="145" rx="12" class="b"/><text x="18" y="62" class="s">User selects incorrect-label case</text><text x="18" y="93" class="s">System displays editable name</text><text x="18" y="124" class="s">User rejects or corrects label</text><text x="18" y="155" class="s">No silent automatic save</text></g><path d="M70 297 H1110" class="a"/><text x="26" y="265" class="t">Interaction flow (each journey)</text><g transform="translate(25,325)"><rect width="250" height="120" rx="12" class="b"/><text x="20" y="39" class="t">1. Start</text><text x="20" y="72" class="s">Select a case</text><text x="20" y="98" class="s">(simulated camera input)</text><rect x="300" width="250" height="120" rx="12" class="b"/><text x="320" y="39" class="t">2. Inspect</text><text x="320" y="72" class="s">Read suggestion + limits</text><text x="320" y="98" class="s">(visible model state)</text><rect x="600" width="250" height="120" rx="12" class="b"/><text x="620" y="39" class="t">3. Decide</text><text x="620" y="72" class="s">Edit, reject or confirm</text><text x="620" y="98" class="s">(user retains agency)</text><rect x="900" width="250" height="120" rx="12" class="b"/><text x="920" y="39" class="t">4. Feedback</text><text x="920" y="72" class="s">Receipt and undo</text><text x="920" y="98" class="s">(reversible action)</text><path d="M250 60 H297" class="a"/><path d="M550 60 H597" class="a"/><path d="M850 60 H897" class="a"/></g><text x="28" y="508" class="t">Scope note</text><text x="28" y="535" class="s">All food labels, values and 'confidence' states are authored test fixtures. A real model, calibration, camera and persistent log are planned.</text><text x="28" y="568" class="s">The prototype's interaction logic is implemented in index.html; these storyboards are explanatory illustrations.</text></svg>
